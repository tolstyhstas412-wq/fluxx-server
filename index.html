<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluxx • Glass</title>
    <style>
        /* --- БАЗА --- */
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; background: #0f172a; }

        /* --- ФОН (АНИМИРОВАННЫЙ ГРАДИЕНТ) --- */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(45deg, #1e1b4b, #0f172a, #312e81, #4c1d95);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ЛЕТАЮЩИЕ ЧАСТИЦЫ --- */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle {
            position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* --- ЭКРАН ВХОДА (СТЕКЛО) --- */
        #login { width: 100%; display: flex; justify-content: center; align-items: center; position: relative; z-index: 10; }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px); /* Эффект размытия */
            padding: 50px 40px; border-radius: 30px; text-align: center; width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .login-box h1 {
            font-size: 48px; font-weight: 800; margin-bottom: 5px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-box p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        
        /* Поля ввода */
        .login-box input {
            width: 100%; padding: 16px; margin: 10px 0;
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3); color: white; outline: none;
            transition: 0.3s; font-size: 15px;
        }
        .login-box input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        
        /* Кнопка */
        .login-box button {
            width: 100%; padding: 16px; margin-top: 20px;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            border: none; color: white; border-radius: 15px; cursor: pointer;
            font-weight: 700; font-size: 16px; transition: 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        /* --- ОСТАЛЬНОЙ ИНТЕРФЕЙС (ЧАТЫ, ПРОФИЛЬ) --- */
        #app { display: none; width: 100%; background: #0f172a; color: white; }
        .nav-sidebar { width: 80px; background: #1e293b; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; border-right: 1px solid #334155; }
        .nav-icon { font-size: 24px; cursor: pointer; padding: 15px; border-radius: 15px; color: #94a3b8; }
        .nav-icon:hover, .nav-icon.active { background: #334155; color: #60a5fa; }
        .content-area { display: flex; flex: 1; }
        .sidebar { width: 300px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; }
        .user-item { padding: 15px 20px; cursor: pointer; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #334155; }
        .user-item:hover { background: #334155; }
        .avatar { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-weight: 800; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; background-size: cover; background-position: center; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 20px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 700; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 18px; max-width: 65%; font-size: 15px; }
        .my-msg { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .other-msg { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; opacity: 0.6; float: right; margin-left: 10px; margin-top: 5px; }
        .input-area { padding: 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 15px; }
        .input-area input { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .input-area button { padding: 15px 25px; border-radius: 15px; background: #60a5fa; color: #0f172a; border: none; cursor: pointer; font-weight: bold; }
        
        #profile-panel { display: none; flex: 1; flex-direction: column; padding: 40px; align-items: center; background: #0f172a; }
        .profile-card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 20px; text-align: center; width: 400px; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px auto; font-size: 40px; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #3b82f6, #8b5cf6); background-size: cover; background-position: center; }
    </style>
</head>
<body>
    <!-- Фон и частицы -->
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <!-- ЭКРАН ВХОДА -->
    <div id="login">
        <div class="login-box">
            <h1>Fluxx</h1>
            <p>Мессенджер будущего</p>
            <input type="text" id="name" placeholder="Твое имя">
            <input type="text" id="phone" placeholder="Номер телефона">
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="doLogin()">Войти в систему</button>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div id="app">
        <div class="nav-sidebar">
            <div class="nav-icon active" onclick="switchTab('chats')">💬</div>
            <div class="nav-icon" onclick="switchTab('profile')">👤</div>
        </div>
        <div class="content-area">
            <div id="chats-panel" style="display:flex; width:100%;">
                <div class="sidebar"><div id="usersList"></div></div>
                <div class="chat-area">
                    <div class="chat-header"><span id="chatTitle">Выберите чат</span></div>
                    <div class="chat-messages" id="msgBox"></div>
                    <div class="input-area" id="inputArea" style="display:none;">
                        <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                        <button onclick="sendMsg()">Отправить</button>
                    </div>
                </div>
            </div>
            <div id="profile-panel">
                <div class="profile-card">
                    <div class="profile-avatar" id="myAvatar">?</div>
                    <h2 id="myName">Имя</h2>
                    <p id="myPhone" style="color:#94a3b8;">Номер</p>
                    <input type="file" id="avatarUpload" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
                    <button onclick="document.getElementById('avatarUpload').click()" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:10px; margin-top:10px; cursor:pointer;">📷 Сменить аватарку</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ГЕНЕРАЦИЯ ЧАСТИЦ ---
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 6 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(p);
        }

        let MY_PHONE = "", CURRENT_CHAT = "", botMsgs = [], ALL_USERS = {};

        async function doLogin() {
            const n = document.getElementById('name').value;
            const p = document.getElementById('phone').value;
            const pass = document.getElementById('pass').value;
            if (!n || !p || !pass) return alert("Заполни поля!");

            const res = await fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name:n, phone:p, password:pass}) });
            const data = await res.json();
            
            if (data.status === 'ok') {
                MY_PHONE = p; MY_NAME = n;
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadUsers(); 
                setInterval(() => { if (CURRENT_CHAT && CURRENT_CHAT !== "999") checkMsgs(); }, 1000);
            } else { alert(data.message); }
        }

        async function loadUsers() {
            const res = await fetch('/getUsers');
            ALL_USERS = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = `<div class="user-item" onclick="openChat('999', 'Бот')"><div class="avatar" style="background:linear-gradient(135deg, #ec4899, #8b5cf6);">🤖</div><div>Fluxx Bot</div></div>`;
            
            for (const phone in ALL_USERS) {
                if (phone === MY_PHONE) continue;
                const u = ALL_USERS[phone];
                let avStyle = u.avatar ? `background-image: url(${u.avatar});` : '';
                list.innerHTML += `<div class="user-item" onclick="openChat('${phone}', '${u.name}')"><div class="avatar" style="${avStyle}">${u.avatar ? '' : u.name[0].toUpperCase()}</div><div>${u.name}</div></div>`;
            }
        }

        function openChat(phone, name) {
            CURRENT_CHAT = phone;
            document.getElementById('chatTitle').innerText = name;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('msgBox').innerHTML = '';
            if (phone === "999" && botMsgs.length === 0) botMsgs.push({id:1, from:"999", to:MY_PHONE, text:"Привет! Я Fluxx Bot. Чем могу помочь?", time:"12:00"});
            renderMsgs(); 
        }

        async function sendMsg() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text || !CURRENT_CHAT) return;
            if (CURRENT_CHAT === "999") {
                botMsgs.push({id:Date.now(), from:MY_PHONE, to:"999", text:text, time:"12:00"});
                document.getElementById('msgInput').value = '';
                renderMsgs();
                setTimeout(() => { botMsgs.push({id:Date.now(), from:"999", to:MY_PHONE, text:"Интересно!", time:"12:01"}); renderMsgs(); }, 1000);
            } else {
                await fetch('/sendMessage', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({from:MY_PHONE, to:CURRENT_CHAT, text:text}) });
                document.getElementById('msgInput').value = '';
                checkMsgs();
            }
        }

        async function checkMsgs() {
            if (!CURRENT_CHAT || CURRENT_CHAT === "999") return;
            const res = await fetch(`/getMessages?user1=${MY_PHONE}&user2=${CURRENT_CHAT}`);
            const msgs = await res.json();
            renderMsgs(msgs);
        }

        function renderMsgs(msgs = null) {
            let messages = msgs;
            if (!messages) {
                if (CURRENT_CHAT === "999") { messages = botMsgs; } else { return; }
            }
            const box = document.getElementById('msgBox');
            box.innerHTML = '';
            messages.forEach(m => {
                box.innerHTML += `
                    <div class="message ${m.from === MY_PHONE ? 'my-msg' : 'other-msg'}">
                        ${m.text} <span class="msg-time">${m.time}</span>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }

        function switchTab(tab) {
            document.getElementById('chats-panel').style.display = 'none';
            document.getElementById('profile-panel').style.display = 'none';
            document.querySelectorAll('.nav-icon').forEach(i => i.classList.remove('active'));

            if (tab === 'chats') { document.getElementById('chats-panel').style.display = 'flex'; document.querySelectorAll('.nav-icon')[0].classList.add('active'); }
            if (tab === 'profile') { 
                document.getElementById('profile-panel').style.display = 'flex'; 
                document.querySelectorAll('.nav-icon')[1].classList.add('active'); 
                document.getElementById('myName').innerText = MY_NAME; 
                document.getElementById('myPhone').innerText = MY_PHONE; 
            }
        }

        function uploadAvatar(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const avatarUrl = e.target.result;
                fetch('/updateAvatar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: MY_PHONE, avatar: avatarUrl}) });
                document.getElementById('myAvatar').style.backgroundImage = `url(${avatarUrl})`;
                document.getElementById('myAvatar').innerText = '';
                loadUsers();
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
