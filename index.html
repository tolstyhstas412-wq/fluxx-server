<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluxx • Ultimate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модалка профиля собеседника -->
    <div id="info-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-card" style="background:var(--glass); border:1px solid var(--glass-border); padding:40px; border-radius:30px; text-align:center; width:380px; position:relative;">
            <button class="modal-close" onclick="closeInfo()" style="position:absolute; top:15px; right:20px; background:none; border:none; color:white; font-size:24px; cursor:pointer;">×</button>
            <div class="modal-avatar" id="info-avatar" style="width:120px; height:120px; border-radius:40px; margin:0 auto 20px auto; font-size:50px; display:flex; justify-content:center; align-items:center; background-size:cover; background-position:center; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:2px solid var(--glass-border);">?</div>
            <h2 id="info-name" style="margin-bottom:10px;">Имя</h2>
            <p id="info-status" style="color:var(--gold); margin-bottom:20px;">Статус</p>
            <p id="info-phone" style="color:var(--text-sub); font-size:14px;">Номер</p>
            <button class="status-btn" style="background:var(--accent); margin-top:20px;" onclick="closeInfo()">Закрыть</button>
        </div>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <h1>Fluxx</h1>
            <p>Твой личный мессенджер</p>
            <input type="text" id="regName" placeholder="Твое имя">
            <input type="text" id="regPhone" placeholder="Номер телефона">
            <button onclick="login()">Войти в аккаунт</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="nav-sidebar">
            <div class="nav-icon active" id="nav-chats" onclick="switchTab('chats')" title="Чаты">💬</div>
            <div class="nav-icon" id="nav-profile" onclick="switchTab('profile')" title="Профиль">👤</div>
            <div class="nav-icon" id="nav-settings" onclick="switchTab('settings')" title="Настройки">⚙️</div>
        </div>
        <div class="content-area">
            <div id="chats-panel">
                <div class="sidebar"><div id="users-list" style="overflow-y:auto; flex:1;"></div></div>
                <div class="chat-area">
                    <div class="chat-header">
                        <div class="chat-header-info">
                            <span id="chat-with">Выберите собеседника</span>
                            <!-- Кнопка теперь видна всегда -->
                            <button class="btn-info" id="info-btn" onclick="openInfo()" title="Информация">ℹ️</button>
                        </div>
                        <button class="btn-secret" style="display:none;" id="secret-btn" onclick="toggleSecret()">🔥 Секретный чат</button>
                    </div>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="input-area" id="input-area" style="display:none;">
                        <button onclick="toggleEmoji()" style="background: transparent;">😀</button>
                        <div class="emoji-picker" id="emoji-picker">
                            <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span>
                            <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span>
                            <span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('🤔')">🤔</span>
                            <span onclick="addEmoji('💀')">💀</span><span onclick="addEmoji('👻')">👻</span><span onclick="addEmoji('🤖')">🤖</span>
                            <span onclick="addEmoji('🍻')">🍻</span><span onclick="addEmoji('🍕')">🍕</span><span onclick="addEmoji('🎮')">🎮</span>
                            <span onclick="addEmoji('⚽')">⚽</span><span onclick="addEmoji('💩')">💩</span><span onclick="addEmoji('😈')">😈</span>
                        </div>
                        <input type="file" id="file-upload" accept="image/*" style="display:none;" onchange="uploadChatImage(event)">
                        <button onclick="document.getElementById('file-upload').click()" style="background: transparent;">📎</button>
                        <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
                        <button class="btn-gift" onclick="sendGift()">🎁</button>
                        <button onclick="sendMessage()" style="background: var(--accent); color: white;">➤</button>
                    </div>
                </div>
            </div>
            
            <div id="profile-panel">
                <div class="profile-card">
                    <div class="profile-avatar" id="profile-avatar">?</div>
                    <h2 id="profile-name">Имя</h2>
                    <p id="profile-status">Обычный</p>
                    <p id="profile-phone">Номер</p>
                    <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
                    <button class="status-btn" style="background:rgba(255,255,255,0.1);" onclick="document.getElementById('avatar-upload').click()">📷 Сменить аватарку</button>
                    <p style="margin-top:30px;">СТАТУС:</p>
                    <button class="status-btn" style="background:rgba(255,255,255,0.05);" onclick="setStatus('user')">👤 Обычный</button>
                    <button class="status-btn" style="background:linear-gradient(135deg, #b45309, #f59e0b);" onclick="setStatus('premium')">⭐ PREMIUM</button>
                    <button class="status-btn" style="background:linear-gradient(135deg, #6b21a8, #a855f7);" onclick="setStatus('vip')">👑 VIP</button>
                    <button class="status-btn logout-btn" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>

            <div id="settings-panel">
                <h2>Настройки</h2>
                <div class="settings-card"><span>Светлая тема</span><label class="switch"><input type="checkbox" id="theme-checkbox" onchange="toggleTheme()"><span class="slider"></span></label></div>
                <div class="settings-card"><span>Звук</span><label class="switch"><input type="checkbox" id="sound-checkbox" checked onchange="toggleSound()"><span class="slider"></span></label></div>
                <div class="settings-card" style="cursor:pointer; color:#ef4444;" onclick="clearHistory()"><span>Очистить историю чата</span><span>🗑️</span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="app2.js"></script>
</body>
</html>
