<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluxx 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модалка Инфо -->
    <div id="info-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeInfo()" style="position:absolute; top:10px; right:15px; background:none; border:none; color:white; font-size:24px; cursor:pointer;">×</button>
            <div class="profile-avatar" id="info-avatar">?</div>
            <h2 id="info-name">Имя</h2>
            <p id="info-status" style="color:var(--accent);">Статус</p>
            <p id="info-phone" style="color:var(--sub);">Номер</p>
            <button class="status-btn" style="background:var(--accent); color:#000; margin-top:20px;" onclick="closeInfo()">Закрыть</button>
        </div>
    </div>

    <!-- Вход -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Fluxx</h1>
            <p>Мессенджер будущего</p>
            <input type="text" id="regName" placeholder="Твое имя">
            <input type="text" id="regPhone" placeholder="Номер телефона">
            <input type="password" id="regPassword" placeholder="Пароль">
            <button onclick="login()">Войти в сеть</button>
        </div>
    </div>

    <!-- Приложение -->
    <div id="app-screen">
        <div class="nav-sidebar">
            <div class="nav-icon active" id="nav-chats" onclick="switchTab('chats')">💬</div>
            <div class="nav-icon" id="nav-profile" onclick="switchTab('profile')">👤</div>
            <div class="nav-icon" id="nav-settings" onclick="switchTab('settings')">⚙️</div>
        </div>
        <div class="content-area">
            <div id="chats-panel">
                <div class="sidebar"><div id="users-list"></div></div>
                <div class="chat-area">
                    <div class="chat-header">
                        <div class="chat-header-info">
                            <span id="chat-with">Выберите чат</span>
                            <button class="btn-info" id="info-btn" onclick="openInfo()">ℹ️</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="input-area" id="input-area" style="display:none;">
                        <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
            <!-- Профиль и Настройки -->
            <div id="profile-panel">
                <div class="profile-card">
                    <div class="profile-avatar" id="profile-avatar">?</div>
                    <h2 id="profile-name">Имя</h2>
                    <p id="profile-phone">Номер</p>
                    <button class="status-btn" style="background:var(--accent); color:#000;" onclick="logout()">Выйти из аккаунта</button>
                </div>
            </div>
            <div id="settings-panel">
                <h2>Настройки</h2>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="app2.js"></script>
</body>
</html>
