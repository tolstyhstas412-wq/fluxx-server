<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluxx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login">
        <div class="box">
            <h1>Fluxx</h1>
            <input type="text" id="name" placeholder="Имя">
            <input type="text" id="phone" placeholder="Номер">
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="doLogin()">Войти в сеть</button>
        </div>
    </div>

    <div id="app">
        <div class="sidebar-menu">
            <div class="menu-header" onclick="alert('Профиль: ' + MY_NAME)">
                <div class="menu-avatar" id="myAvatar">?</div>
                <div>
                    <h3 id="myName" style="margin:0;">Имя</h3>
                    <p id="myPhone" style="margin:5px 0 0; font-size:12px; color:var(--sub);">Номер</p>
                </div>
            </div>
            <div class="menu-items">
                <div class="menu-item">⚙️ Настройки</div>
                <div class="menu-item">🗑️ Очистить чат</div>
            </div>
            <div style="padding: 15px 20px; color: var(--sub); font-size: 12px; font-weight: bold;">ЧАТЫ</div>
            <div id="usersList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header"><span id="chatTitle">Выберите чат</span></div>
            <div class="chat-messages" id="msgBox"></div>
            <div class="input-area" id="inputArea" style="display:none;">
                <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
