<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fluxx</title>
    <style>
        body { background: #050505; color: white; font-family: Arial; margin: 0; display: flex; height: 100vh; }
        #login { width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .box { background: rgba(20,20,30,0.8); padding: 40px; border-radius: 15px; border: 1px solid #00ffff; box-shadow: 0 0 15px #00ffff; text-align: center; width: 300px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; }
        input { background: #111; color: white; border: 1px solid #333; }
        button { background: #00ffff; color: black; font-weight: bold; cursor: pointer; }
        #app { display: none; width: 100%; }
        .sidebar { width: 250px; background: #111; border-right: 1px solid #333; }
        .user { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; }
        .user:hover { background: #222; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 60%; position: relative; }
        .my { background: #0044ff; align-self: flex-end; }
        .other { background: #222; align-self: flex-start; }
        .input-area { padding: 15px; background: #111; display: flex; gap: 10px; }
        .reactions { position: absolute; bottom: -15px; right: 5px; background: black; border: 1px solid #00ffff; border-radius: 15px; padding: 2px 8px; font-size: 14px; display: none; gap: 5px; cursor: pointer; }
        .msg:hover .reactions { display: flex; }
    </style>
</head>
<body>
    <div id="login">
        <div class="box">
            <h1 style="color:#00ffff;">Fluxx</h1>
            <input type="text" id="name" placeholder="Имя">
            <input type="text" id="phone" placeholder="Номер">
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="doLogin()">Войти</button>
        </div>
    </div>

    <div id="app">
        <div class="sidebar" id="usersList"></div>
        <div class="chat">
            <div id="chatHeader" style="padding:15px; background:#111; border-bottom:1px solid #333;">Выберите чат</div>
            <div class="messages" id="msgBox"></div>
            <div class="input-area" id="inputArea" style="display:none;">
                <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let MY_PHONE = "", CURRENT_CHAT = "", botMsgs = [];

        async function doLogin() {
            const n = document.getElementById('name').value;
            const p = document.getElementById('phone').value;
            const pass = document.getElementById('pass').value;
            if (!n || !p || !pass) return alert("Заполни поля!");

            const res = await fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name:n, phone:p, password:pass}) });
            const data = await res.json();
            
            if (data.status === 'ok') {
                MY_PHONE = p;
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadUsers(); setInterval(() => { if (CURRENT_CHAT && CURRENT_CHAT !== "999") checkMsgs(); }, 1000);
            } else { alert(data.message); }
        }

        async function loadUsers() {
            const res = await fetch('/getUsers');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = `<div class="user" onclick="openChat('999', 'Бот')">🤖 Бот</div>`;
            
            for (const phone in users) {
                if (phone === MY_PHONE) continue;
                list.innerHTML += `<div class="user" onclick="openChat('${phone}', '${users[phone].name}')">${users[phone].name}</div>`;
            }
        }

        function openChat(phone, name) {
            CURRENT_CHAT = phone;
            document.getElementById('chatHeader').innerText = name;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('msgBox').innerHTML = '';
            if (phone === "999" && botMsgs.length === 0) botMsgs.push({id:1, from:"999", to:MY_PHONE, text:"Привет! Я Fluxx Bot.", time:"12:00"});
            renderMsgs(); // Сразу рисуем
        }

        async function sendMsg() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text || !CURRENT_CHAT) return;
            if (CURRENT_CHAT === "999") {
                botMsgs.push({id:Date.now(), from:MY_PHONE, to:"999", text:text, time:"12:00"});
                document.getElementById('msgInput').value = '';
                renderMsgs();
                setTimeout(() => { botMsgs.push({id:Date.now(), from:"999", to:MY_PHONE, text:"Интересно!", time:"12:01"}); renderMsgs(); }, 1000);
            } else {
                await fetch('/sendMessage', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({from:MY_PHONE, to:CURRENT_CHAT, text:text}) });
                document.getElementById('msgInput').value = '';
                checkMsgs();
            }
        }

        async function addReact(id, emoji) {
            if (CURRENT_CHAT === "999") return;
            await fetch('/addReaction', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id:String(id), reaction:emoji}) });
            checkMsgs(); // Сразу обновляем
        }

        async function checkMsgs() {
            if (!CURRENT_CHAT || CURRENT_CHAT === "999") return;
            const res = await fetch(`/getMessages?user1=${MY_PHONE}&user2=${CURRENT_CHAT}`);
            const msgs = await res.json();
            renderMsgs(msgs);
        }

        function renderMsgs(msgs = null) {
            let messages = msgs;
            if (!messages) {
                if (CURRENT_CHAT === "999") { messages = botMsgs; } 
                else { return; }
            }

            const box = document.getElementById('msgBox');
            box.innerHTML = '';
            messages.forEach(m => {
                box.innerHTML += `
                    <div class="msg ${m.from === MY_PHONE ? 'my' : 'other'}">
                        ${m.text}
                        <div class="reactions" style="${m.reaction ? 'display:flex;' : ''}">
                            <span onclick="addReact('${m.id}', '❤️')">❤️</span>
                            <span onclick="addReact('${m.id}', '🔥')">🔥</span>
                            <span onclick="addReact('${m.id}', '😂')">😂</span>
                            ${m.reaction ? m.reaction : ''}
                        </div>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
